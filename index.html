<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>דייט ♡</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf7f0" />
    <meta name="description" content="יש לי שאלה אחת בשבילך ♡" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- link preview: scrapers run no scripts and need an absolute image URL, so this is static -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="אנה, את רוצה לצאת איתי לדייט?" />
    <meta property="og:description" content="יש לי שאלה אחת בשבילך ♡" />
    <meta
      property="og:image"
      content="https://issue-lanes.github.io/date-invite-site/avatar/pose-1.webp"
    />
    <meta property="og:url" content="https://issue-lanes.github.io/date-invite-site/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="./assets/index-BYerMpSk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DztbtrQc.css">
  </head>
  <body>
    <main>
      <section id="ask">
        <h1 data-testid="question"></h1>
        <p class="sub" data-t="sub"></p>
        <div class="row">
          <button class="btn yes" data-testid="yes" data-t="yes"></button>
          <span class="no-slot"><button class="btn no" data-testid="no" data-t="no"></button></span>
        </div>
        <p class="shy" data-testid="shy" data-t="shy" hidden></p>
        <button class="link" data-testid="not-now" data-t="notNow"></button>
      </section>

      <section id="yay" hidden>
        <!-- the testid div holds pose 1 (a test wants one img in it); poses 2, 3 sit beside it -->
        <div class="avatar">
          <div data-testid="avatar">
            <svg viewBox="0 0 120 120" width="160" height="160" role="img" aria-label="👑">
              <circle cx="60" cy="74" r="34" fill="#f3d9b1" stroke="#111" stroke-width="3" />
              <path d="M28 52 L36 22 L50 42 L60 16 L70 42 L84 22 L92 52 Z"
                fill="#d9a62e" stroke="#111" stroke-width="3" stroke-linejoin="round" />
              <circle cx="48" cy="76" r="3.5" fill="#111" />
              <circle cx="72" cy="76" r="3.5" fill="#111" />
              <path d="M50 88 Q60 97 70 88" fill="none" stroke="#111" stroke-width="3"
                stroke-linecap="round" />
            </svg>
          </div>
          <img class="f2" data-src="avatar/pose-2.webp" alt="" />
          <img class="f3" data-src="avatar/pose-3.webp" alt="" />
        </div>
        <p class="chip" data-testid="yay" data-t="chip"></p>
        <h2 data-t="yayTitle"></h2>
        <button class="btn yes" data-testid="to-slots" data-t="toSlots"></button>
      </section>

      <section id="slots" hidden>
        <img class="pose" data-src="avatar/pose-2.webp" alt="" />
        <h2 data-t="slotsTitle"></h2>
        <div class="grid" data-testid="grid"></div>
        <input class="other" data-testid="other-text" hidden />
        <button class="btn yes" data-testid="continue" data-t="continue" disabled></button>
      </section>

      <section id="send" hidden>
        <div class="hearts" aria-hidden="true">
          <i>♡</i>
          <i>♡</i>
          <i>♡</i>
          <i>♡</i>
          <i>♡</i>
          <i>♡</i>
          <i>♡</i>
          <i>♡</i>
        </div>
        <img class="pose" data-src="avatar/pose-3.webp" alt="" />
        <p class="summary" data-testid="summary"></p>
        <p class="message" data-testid="message"></p>
        <a class="btn yes" data-testid="whatsapp" data-t="whatsapp" target="_blank"
          rel="noopener"></a>
        <button class="btn out" data-testid="copy" data-t="copy"></button>
        <p class="shy" data-testid="copy-fail" data-t="copyFail" hidden></p>
        <button class="link" data-testid="back" data-t="back"></button>
      </section>
    </main>
  </body>
</html>
